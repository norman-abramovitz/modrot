name: action-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        uses: ./
        with:
          # newest published release — the action's own default may name a tag
          # whose release does not exist yet while its stamp PR is in flight
          version: v0.11.0
      - name: assert outputs
        shell: bash
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          set -euo pipefail
          [ -s "$SARIF" ] || { echo "::error::SARIF file missing or empty"; exit 1; }
          jq -e '.runs[0].tool.driver.name == "modrot"' "$SARIF" >/dev/null
          case "$CODE" in
            0|1|3) echo "exit-code=$CODE (ok)" ;;
            *) echo "::error::unexpected exit-code $CODE"; exit 1 ;;
          esac
